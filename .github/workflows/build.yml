
name: Build Tafawuq AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q Tafawuq_Android_Project_Complete.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build AAB
        run: gradle -p "$PROJECT_DIR" bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tafawuq-AAB
          path: extracted/**/app/build/outputs/bundle/release/*.aab
          
